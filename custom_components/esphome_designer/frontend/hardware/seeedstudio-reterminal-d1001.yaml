# ============================================================================
# ESPHome YAML - Generated by ESPHome Designer
# ============================================================================
# TARGET DEVICE: Seeed Studio reTerminal D1001
#         - Display Platform: mipi_dsi
#         - Touchscreen: GSL3670
#         - PSRAM: Yes (Hex, 32MB module)
#         - Framework: ESP-IDF with experimental ESP32-P4 features
# Name: Seeed Studio reTerminal D1001
# Resolution: 800x1280
# Shape: rect
# Chip: esp32-p4
# Board: esp32-p4-evboard
# ============================================================================
#
# HARDWARE NOTES:
#         - ESP32-P4 boards do not have built-in WiFi. This board uses an
#           ESP32-C6 companion over SDIO, configured below via esp32_hosted.
#         - esp_ldo channel 3 powers the MIPI display rail.
#         - An XL9535 I2C expander drives the panel power, reset and backlight
#           enable lines. The SEEED-RETERMINAL-D1001 display model requires it
#           and resolves those pins itself, so they are not repeated here.
#         - GPIO14 drives the display backlight PWM.
#         - The GSL3670 touch controller downloads its firmware blob at build
#           time; its reset, interrupt and calibration come from the model.
#         - I2C bus 0 (GPIO37/GPIO38) carries touch and camera, I2C bus 1
#           (GPIO20/GPIO21) carries the codecs, expander, IMU and RTC.
#         - ES8311 (speaker) and ES7210 (dual microphone) use separate I2S
#           buses.
#         - Camera, TF card, IMU, RTC, battery and mPCIe are left for manual
#           extension.
#         - Pin assignments come from the Seeed reTerminal-D1001 BSP headers
#           and have not been confirmed on physical hardware.
#
# SETUP INSTRUCTIONS:
#
# STEP 1: Create a new device in ESPHome
#         - Click "New Device"
#         - Select: ESP32-P4
#         - Board: esp32-p4-evboard
#         - Framework: ESP-IDF (Required)
#
# STEP 2: PASTE this snippet into your device YAML
#         - Paste this snippet at the end of your configuration.
#         - System sections (esphome, esp32, esp32_hosted, psram, esp_ldo)
#           are included because they are required for this board to boot,
#           connect to WiFi, and power the display.
#
# ============================================================================

esphome:
  min_version: 2026.7.0
  project:
    name: "Seeed.reTerminal-D1001"
    version: "1.0"

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  cpu_frequency: 360MHz
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO13
  cmd_pin: GPIO6
  clk_pin: GPIO11
  d0_pin: GPIO7
  d1_pin: GPIO8
  d2_pin: GPIO9
  d3_pin: GPIO10
  active_high: true

i2c:
  - id: i2c_bus
    sda: GPIO37
    scl: GPIO38
    scan: false
    frequency: 400kHz
  - id: i2c_system
    sda: GPIO20
    scl: GPIO21
    scan: false
    frequency: 400kHz

xl9535:
  - id: io_expander
    i2c_id: i2c_system
    address: 0x20

output:
  - platform: ledc
    pin: GPIO14
    id: gpio_backlight_pwm

light:
  - platform: monochromatic
    id: display_backlight
    name: Backlight
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: gsl3670
    id: device_touchscreen
    i2c_id: i2c_bus
    model: SEEED-RETERMINAL-D1001
    update_interval: 16ms
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight

display:
  - platform: mipi_dsi
    id: main_display
    model: SEEED-RETERMINAL-D1001
    byte_order: little_endian
    rotation: 90
    update_interval: never
    auto_clear_enabled: false
    # __LAMBDA_PLACEHOLDER__

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    i2c_id: i2c_system

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    i2c_id: i2c_system

i2s_audio:
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO31
    i2s_bclk_pin: GPIO32
    i2s_mclk_pin: GPIO33
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO27
    i2s_bclk_pin: GPIO28
    i2s_mclk_pin: GPIO29

microphone:
  - platform: i2s_audio
    id: es7210_mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO26
    adc_type: external
    pdm: false
    channel: left

speaker:
  - platform: i2s_audio
    id: es8311_hardware_out
    i2s_audio_id: i2s_speaker_bus
    i2s_dout_pin: GPIO30
    dac_type: external
    audio_dac: es8311_dac
